name: Verify model and build interface
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/reproduce.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Check browser workflows
        shell: bash
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          node scripts/qa_browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chemical-release-verified-build
          path: |
            frontend/dist/
            pytest-results.xml
            report/evidence/verification.json
            report/evidence/summary.json
            report/evidence/browser-checks.json
            report/evidence/ui-*.png
